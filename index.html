<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ほやぼーや | 気仙沼市</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(180deg, #b3e0f5 0%, #6bbdd8 40%, #2e7fa8 100%);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem 1rem;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    color: #fff;
    text-shadow: 2px 3px 0 #1a5a78, 0 0 20px rgba(255,255,255,0.4);
    letter-spacing: 0.15em;
    margin-bottom: 0.3rem;
    text-align: center;
  }
  .sub {
    color: #d6f0ff;
    font-size: clamp(0.85rem, 3vw, 1.05rem);
    letter-spacing: 0.2em;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  .stage {
    position: relative;
    width: min(320px, 85vw);
  }

  /* ほやぼーや SVG アニメーション */
  .hoya-wrap {
    animation: float 3s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-12px); }
  }

  /* 波 */
  .wave-wrap {
    margin-top: -10px;
    overflow: visible;
  }

  .speech {
    background: #fff;
    border-radius: 1.5rem;
    padding: 0.7rem 1.2rem;
    font-size: clamp(0.95rem, 3.5vw, 1.1rem);
    color: #e05c00;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    margin-top: 1rem;
    position: relative;
    letter-spacing: 0.08em;
  }
  .speech::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-bottom-color: #fff;
  }
</style>
</head>
<body>

<h1>ほやぼーや</h1>
<p class="sub">気仙沼市のマスコットキャラクター</p>

<div class="stage">

  <!-- ほやぼーや本体 -->
  <svg class="hoya-wrap" viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- ほやの体グラデーション -->
      <radialGradient id="bodyGrad" cx="40%" cy="35%" r="60%">
        <stop offset="0%"   stop-color="#ffb347"/>
        <stop offset="60%"  stop-color="#e05c00"/>
        <stop offset="100%" stop-color="#a33a00"/>
      </radialGradient>
      <!-- 口のある腹部 -->
      <radialGradient id="bellyGrad" cx="50%" cy="40%" r="55%">
        <stop offset="0%"  stop-color="#ffe9c8"/>
        <stop offset="100%" stop-color="#ffcb80"/>
      </radialGradient>
      <!-- 管グラデーション -->
      <linearGradient id="tubeGrad1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#ff8c2a"/>
        <stop offset="100%" stop-color="#e05c00"/>
      </linearGradient>
      <linearGradient id="tubeGrad2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#e05c00"/>
        <stop offset="100%" stop-color="#ff8c2a"/>
      </linearGradient>
      <!-- 影 -->
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#1a4060" flood-opacity="0.4"/>
      </filter>
    </defs>

    <!-- ===== 体 ===== -->
    <!-- 根っこ(足) -->
    <ellipse cx="160" cy="300" rx="55" ry="18" fill="#a33a00" opacity="0.6"/>
    <path d="M130 285 Q125 305 115 315 Q120 310 135 295Z" fill="#8b2e00"/>
    <path d="M155 290 Q150 312 145 320 Q152 308 162 292Z" fill="#8b2e00"/>
    <path d="M182 288 Q188 310 195 318 Q188 307 178 292Z" fill="#8b2e00"/>

    <!-- メインボディ -->
    <ellipse cx="160" cy="215" rx="95" ry="100" fill="url(#bodyGrad)" filter="url(#shadow)"/>

    <!-- おなかの白っぽい部分 -->
    <ellipse cx="158" cy="225" rx="58" ry="68" fill="url(#bellyGrad)" opacity="0.85"/>

    <!-- ボディのブツブツ(ほやらしいイボ) -->
    <circle cx="105" cy="195" r="8" fill="#c94a00" opacity="0.5"/>
    <circle cx="215" cy="200" r="7" fill="#c94a00" opacity="0.5"/>
    <circle cx="108" cy="240" r="6" fill="#c94a00" opacity="0.4"/>
    <circle cx="212" cy="245" r="7" fill="#c94a00" opacity="0.4"/>
    <circle cx="120" cy="165" r="5" fill="#c94a00" opacity="0.4"/>
    <circle cx="200" cy="168" r="5.5" fill="#c94a00" opacity="0.4"/>

    <!-- ===== 管(出水孔・入水孔) ===== -->
    <!-- 左の管 -->
    <rect x="120" y="115" width="32" height="55" rx="16" fill="url(#tubeGrad1)"/>
    <ellipse cx="136" cy="113" rx="18" ry="10" fill="#ff9b3a"/>
    <!-- 管の口(ぱっちり開いた感じ) -->
    <ellipse cx="136" cy="112" rx="12" ry="7" fill="#6b1a00"/>
    <ellipse cx="136" cy="112" rx="8" ry="4.5" fill="#3a0a00"/>

    <!-- 右の管 -->
    <rect x="168" y="110" width="32" height="60" rx="16" fill="url(#tubeGrad2)"/>
    <ellipse cx="184" cy="108" rx="18" ry="10" fill="#ff9b3a"/>
    <ellipse cx="184" cy="107" rx="12" ry="7" fill="#6b1a00"/>
    <ellipse cx="184" cy="107" rx="8" ry="4.5" fill="#3a0a00"/>

    <!-- 管のしわ -->
    <line x1="122" y1="140" x2="150" y2="140" stroke="#c94a00" stroke-width="1.5" opacity="0.5"/>
    <line x1="122" y1="150" x2="150" y2="150" stroke="#c94a00" stroke-width="1.5" opacity="0.5"/>
    <line x1="170" y1="135" x2="198" y2="135" stroke="#c94a00" stroke-width="1.5" opacity="0.5"/>
    <line x1="170" y1="145" x2="198" y2="145" stroke="#c94a00" stroke-width="1.5" opacity="0.5"/>
    <line x1="170" y1="155" x2="198" y2="155" stroke="#c94a00" stroke-width="1.5" opacity="0.5"/>

    <!-- ===== 顔 ===== -->
    <!-- 目(左) -->
    <ellipse cx="136" cy="218" rx="14" ry="16" fill="#fff"/>
    <ellipse cx="138" cy="220" rx="9" ry="10" fill="#3a2000"/>
    <ellipse cx="140" cy="221" rx="5.5" ry="6.5" fill="#1a0a00"/>
    <circle  cx="141" cy="218" r="3" fill="#fff"/>

    <!-- 目(右) -->
    <ellipse cx="184" cy="218" rx="14" ry="16" fill="#fff"/>
    <ellipse cx="186" cy="220" rx="9" ry="10" fill="#3a2000"/>
    <ellipse cx="188" cy="221" rx="5.5" ry="6.5" fill="#1a0a00"/>
    <circle  cx="189" cy="218" r="3" fill="#fff"/>

    <!-- まつ毛 -->
    <path d="M124 210 Q128 206 132 210" stroke="#3a2000" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M172 210 Q176 206 180 210" stroke="#3a2000" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ほっぺ -->
    <ellipse cx="118" cy="232" rx="12" ry="8" fill="#ff7c7c" opacity="0.5"/>
    <ellipse cx="202" cy="232" rx="12" ry="8" fill="#ff7c7c" opacity="0.5"/>

    <!-- 笑顔の口 -->
    <path d="M145 248 Q160 264 175 248" stroke="#7a3000" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- 小さな手(ひれ) -->
    <ellipse cx="75" cy="230" rx="20" ry="11" fill="#e05c00" transform="rotate(-30 75 230)"/>
    <ellipse cx="245" cy="230" rx="20" ry="11" fill="#e05c00" transform="rotate(30 245 230)"/>

    <!-- ===== アクセサリー: 漁師帽 ===== -->
    <ellipse cx="160" cy="175" rx="62" ry="12" fill="#1a3a5c"/>
    <rect x="120" y="138" width="80" height="38" rx="10" fill="#2255a0"/>
    <rect x="128" y="138" width="64" height="10" rx="5" fill="#3370cc"/>
    <!-- 帽子のつば -->
    <ellipse cx="160" cy="175" rx="72" ry="13" fill="#1a3a5c"/>
    <ellipse cx="160" cy="174" rx="68" ry="9" fill="#224488"/>

    <!-- 帽子のアンカーマーク -->
    <text x="160" y="162" text-anchor="middle" font-size="20" fill="#fff" opacity="0.8">⚓</text>

    <!-- 泡 -->
    <circle cx="245" cy="175" r="7" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <circle cx="258" cy="158" r="4.5" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="265" cy="145" r="3" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.4"/>
    <circle cx="68" cy="180" r="6" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <circle cx="56" cy="164" r="4" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.45"/>
  </svg>

  <!-- 波 -->
  <svg class="wave-wrap" viewBox="0 0 320 60" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 30 Q40 10 80 30 Q120 50 160 30 Q200 10 240 30 Q280 50 320 30 L320 60 L0 60Z"
          fill="#2e7fa8" opacity="0.9"/>
    <path d="M0 40 Q40 22 80 40 Q120 58 160 40 Q200 22 240 40 Q280 58 320 40 L320 60 L0 60Z"
          fill="#1a5a80" opacity="0.8"/>
  </svg>

  <!-- セリフ -->
  <div class="speech">海の幸いっぱい！気仙沼へようこそ🌊</div>

</div>

</body>
</html>
