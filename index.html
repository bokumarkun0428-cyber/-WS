<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ほやぼーや案内所 | 気仙沼グルメ</title>
<style>
  :root {
    --ocean:      #2b7fa8;
    --ocean-dark: #1a5a80;
    --orange:     #e05c00;
    --orange-lt:  #ff8c2a;
    --text:       #1a3a4c;
    --gray:       #556677;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(180deg, #b3e0f5 0%, #6bbdd8 55%, #2e7fa8 100%);
    min-height: 100svh;
    color: var(--text);
    padding-bottom: 3rem;
  }

  /* ===== ヘッダー ===== */
  header {
    text-align: center;
    padding: 1.8rem 1rem 1.2rem;
  }
  .mascot { width: 72px; height: 72px; margin: 0 auto 0.7rem; }
  header h1 {
    font-size: clamp(1.2rem, 5vw, 1.9rem);
    color: #fff;
    text-shadow: 1px 2px 0 var(--ocean-dark);
    letter-spacing: 0.1em;
  }
  header p {
    color: #d6f0ff;
    font-size: clamp(0.82rem, 3vw, 0.95rem);
    margin-top: 0.3rem;
  }

  /* ===== カード共通 ===== */
  .card {
    background: #fff;
    border-radius: 1.4rem;
    padding: 1.4rem;
    margin: 0 1rem 1.2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.13);
  }
  .section-label {
    font-size: 1rem;
    font-weight: 700;
    color: var(--ocean-dark);
    margin-bottom: 1rem;
  }

  /* ===== 気分ボタン ===== */
  .mood-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.55rem;
  }
  .mood-btn {
    background: #f0f8ff;
    border: 2px solid #cce4f5;
    border-radius: 0.9rem;
    padding: 0.75rem 0.4rem;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.88rem;
    color: var(--text);
    text-align: center;
    transition: all 0.18s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.4;
  }
  .mood-btn .em { font-size: 1.7rem; display: block; margin-bottom: 0.2rem; }
  .mood-btn.selected {
    background: var(--ocean);
    border-color: var(--ocean-dark);
    color: #fff;
    transform: scale(1.04);
    box-shadow: 0 3px 10px rgba(43,127,168,0.4);
  }

  /* ===== 検索ボタン ===== */
  .search-btn {
    display: block;
    width: 100%;
    margin-top: 1rem;
    padding: 0.95rem;
    background: linear-gradient(135deg, var(--orange-lt), var(--orange));
    color: #fff;
    border: none;
    border-radius: 1rem;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(224,92,0,0.35);
    transition: all 0.18s;
  }
  .search-btn:not(:disabled):hover,
  .search-btn:not(:disabled):active {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(224,92,0,0.45);
  }
  .search-btn:disabled {
    background: #c8d8e4;
    box-shadow: none;
    cursor: default;
  }

  /* ===== 結果エリア ===== */
  .results { margin: 0 1rem; display: none; }
  .results.show { display: block; }

  .results-title {
    text-align: center;
    color: #fff;
    font-size: clamp(0.9rem, 4vw, 1.1rem);
    font-weight: 700;
    text-shadow: 1px 2px 0 var(--ocean-dark);
    margin-bottom: 1rem;
    line-height: 1.5;
  }

  /* ===== お店カード ===== */
  .shop-card {
    background: #fff;
    border-radius: 1.2rem;
    padding: 1.1rem;
    margin-bottom: 0.9rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    display: flex;
    gap: 0.85rem;
    align-items: flex-start;
    animation: slideIn 0.35s ease both;
  }
  .shop-card:nth-child(2) { animation-delay: 0.1s; }
  .shop-card:nth-child(3) { animation-delay: 0.2s; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .rank-badge {
    min-width: 3rem;
    height: 3rem;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    font-size: 0.68rem;
    line-height: 1.2;
  }
  .rank-badge .rank-num { font-size: 1rem; }
  .rank-1 { background: linear-gradient(135deg,#ffe066,#f5a623); color:#7a5000; }
  .rank-2 { background: linear-gradient(135deg,#e8eef5,#a8b8c8); color:#445566; }
  .rank-3 { background: linear-gradient(135deg,#e8c9a8,#c87941); color:#5c3010; }

  .shop-info { flex: 1; min-width: 0; }
  .shop-header {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-bottom: 0.2rem;
  }
  .shop-name { font-size: 1.05rem; font-weight: 700; }
  .shop-genre {
    font-size: 0.75rem;
    color: var(--ocean);
    font-weight: 600;
    background: #e8f5ff;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
  }
  .shop-desc {
    font-size: 0.82rem;
    color: #556;
    line-height: 1.7;
    margin: 0.4rem 0;
  }
  .shop-recommend {
    font-size: 0.8rem;
    color: var(--orange);
    font-weight: 600;
    margin-bottom: 0.4rem;
  }
  .shop-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
    font-size: 0.78rem;
    color: #778;
    margin-bottom: 0.5rem;
  }
  .match-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tag {
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    background: #eef5fa;
    color: var(--ocean-dark);
  }
  .tag.hit { background: var(--ocean); color: #fff; }

  /* ===== 注記 ===== */
  .disclaimer {
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 0.74rem;
    margin-top: 1.2rem;
    padding: 0 1rem;
  }
</style>
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header>
  <svg class="mascot" viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="mg1" cx="40%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#ffb347"/>
        <stop offset="70%" stop-color="#e05c00"/>
        <stop offset="100%" stop-color="#a33a00"/>
      </radialGradient>
      <radialGradient id="mg2" cx="50%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#ffe9c8"/>
        <stop offset="100%" stop-color="#ffcb80"/>
      </radialGradient>
    </defs>
    <ellipse cx="40" cy="82" rx="18" ry="6" fill="#a33a00" opacity="0.45"/>
    <ellipse cx="40" cy="56" rx="26" ry="28" fill="url(#mg1)"/>
    <ellipse cx="40" cy="60" rx="16" ry="20" fill="url(#mg2)" opacity="0.85"/>
    <rect x="24" y="28" width="10" height="17" rx="5" fill="#e05c00"/>
    <ellipse cx="29" cy="27" rx="6" ry="3.5" fill="#ff9b3a"/>
    <ellipse cx="29" cy="27" rx="4" ry="2.5" fill="#3a0a00"/>
    <rect x="46" y="26" width="10" height="19" rx="5" fill="#e05c00"/>
    <ellipse cx="51" cy="25" rx="6" ry="3.5" fill="#ff9b3a"/>
    <ellipse cx="51" cy="25" rx="4" ry="2.5" fill="#3a0a00"/>
    <ellipse cx="33" cy="57" rx="5" ry="5.5" fill="#fff"/>
    <ellipse cx="34" cy="58" rx="3.2" ry="3.5" fill="#1a0a00"/>
    <circle cx="35" cy="56.5" r="1.2" fill="#fff"/>
    <ellipse cx="47" cy="57" rx="5" ry="5.5" fill="#fff"/>
    <ellipse cx="48" cy="58" rx="3.2" ry="3.5" fill="#1a0a00"/>
    <circle cx="49" cy="56.5" r="1.2" fill="#fff"/>
    <ellipse cx="27" cy="63" rx="5" ry="3" fill="#ff7c7c" opacity="0.5"/>
    <ellipse cx="53" cy="63" rx="5" ry="3" fill="#ff7c7c" opacity="0.5"/>
    <path d="M35 68 Q40 73 45 68" stroke="#7a3000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="40" cy="44" rx="18" ry="4" fill="#1a3a5c"/>
    <rect x="26" y="31" width="28" height="13" rx="4" fill="#2255a0"/>
    <ellipse cx="40" cy="44" rx="20" ry="4.5" fill="#1a3a5c"/>
    <text x="40" y="41" text-anchor="middle" font-size="7" fill="#fff" opacity="0.9">⚓</text>
  </svg>
  <h1>ほやぼーや案内所</h1>
  <p>今の気分を選ぶと、気仙沼のお店をご紹介します！</p>
</header>

<!-- ===== 気分選択 ===== -->
<div class="card">
  <div class="section-label">🎭 今の気分を選んでね（複数選べます）</div>
  <div class="mood-grid" id="moodGrid">
    <button class="mood-btn" data-mood="海の幸"><span class="em">🌊</span>海の幸を食べたい</button>
    <button class="mood-btn" data-mood="名物"><span class="em">🦈</span>気仙沼名物を試したい</button>
    <button class="mood-btn" data-mood="がっつり"><span class="em">💪</span>がっつり食べたい</button>
    <button class="mood-btn" data-mood="くつろぎ"><span class="em">🍵</span>ゆっくりくつろぎたい</button>
    <button class="mood-btn" data-mood="贅沢"><span class="em">✨</span>贅沢な気分</button>
    <button class="mood-btn" data-mood="お酒"><span class="em">🍶</span>お酒を楽しみたい</button>
    <button class="mood-btn" data-mood="リーズナブル"><span class="em">👛</span>お財布にやさしく</button>
    <button class="mood-btn" data-mood="手軽"><span class="em">⚡</span>手軽にサクッと</button>
  </div>
  <button class="search-btn" id="searchBtn" disabled onclick="doSearch()">
    ぴったりのお店を探す 🔍
  </button>
</div>

<!-- ===== 結果 ===== -->
<div class="results" id="results">
  <div class="results-title" id="resultsTitle"></div>
  <div id="shopList"></div>
</div>

<p class="disclaimer">※ お店情報は参考です。ご来店前に最新情報をご確認ください。</p>

<script>
const SHOPS = [
  {
    name: "海の市 食堂",
    emoji: "🐟",
    genre: "海鮮定食・丼",
    desc: "気仙沼漁港から直送の新鮮な魚介を使った定食・海鮮丼が揃う人気食堂。地元民にも観光客にも愛されるお店です。",
    recommend: "おすすめ: メカジキの漬け丼、カツオたたき定食",
    price: "¥800〜1,500",
    addr: "気仙沼市魚市場前",
    tags: ["海の幸", "名物", "手軽", "リーズナブル"]
  },
  {
    name: "ふかひれ料理 鮪立",
    emoji: "🦈",
    genre: "ふかひれ専門",
    desc: "国内屈指のふかひれ産地・気仙沼で本格ふかひれ料理を提供。コラーゲンたっぷりのスープと姿煮が絶品です。",
    recommend: "おすすめ: ふかひれスープ、ふかひれ姿煮定食",
    price: "¥2,000〜8,000",
    addr: "気仙沼市内",
    tags: ["海の幸", "名物", "贅沢"]
  },
  {
    name: "磯料理 浜の家",
    emoji: "🦪",
    genre: "海鮮鍋・磯料理",
    desc: "三陸の豊かな海の幸を使った磯料理の名店。旬の魚介をゆっくり堪能できる落ち着いた雰囲気が人気。",
    recommend: "おすすめ: 海鮮鍋、ホヤの刺身盛り合わせ",
    price: "¥2,500〜5,000",
    addr: "気仙沼市唐桑町",
    tags: ["海の幸", "くつろぎ", "贅沢", "お酒"]
  },
  {
    name: "気仙沼ラーメン 喜楽",
    emoji: "🍜",
    genre: "ラーメン",
    desc: "気仙沼名物・魚介だしのラーメン専門店。濃厚な煮干しと魚のうまみが溶け込んだスープが体を温めます。",
    recommend: "おすすめ: 気仙沼ラーメン、チャーシュー麺",
    price: "¥700〜1,200",
    addr: "気仙沼市中心部",
    tags: ["がっつり", "名物", "リーズナブル", "手軽"]
  },
  {
    name: "ホルモン食堂 三陸亭",
    emoji: "🥩",
    genre: "気仙沼ホルモン",
    desc: "気仙沼B級グルメの雄・ホルモン料理の専門店。モツのうまみたっぷりで、地元の人にも愛されるお店。",
    recommend: "おすすめ: ホルモン定食、ホルモン炒め",
    price: "¥800〜2,000",
    addr: "気仙沼市内",
    tags: ["がっつり", "名物", "お酒", "リーズナブル"]
  },
  {
    name: "かき小屋 唐桑半島",
    emoji: "🦪",
    genre: "かき料理",
    desc: "唐桑産の新鮮な牡蠣をその場で豪快に焼いて食べる体験型グルメ。旬の季節は格別の甘みが楽しめます。",
    recommend: "おすすめ: 焼きがき、かきフライ定食",
    price: "¥1,000〜2,500",
    addr: "気仙沼市唐桑町",
    tags: ["海の幸", "名物", "手軽"]
  },
  {
    name: "割烹 若潮",
    emoji: "🍱",
    genre: "日本料理・懐石",
    desc: "旬の食材を活かした上品な懐石料理。記念日や特別な食事に、三陸の海の幸を丁寧な料理で味わえます。",
    recommend: "おすすめ: 三陸懐石コース、特選刺身盛り合わせ",
    price: "¥5,000〜15,000",
    addr: "気仙沼市内",
    tags: ["贅沢", "くつろぎ", "海の幸"]
  },
  {
    name: "居酒屋 港屋",
    emoji: "🍶",
    genre: "居酒屋・海鮮",
    desc: "地元漁師も集う活気ある居酒屋。新鮮な刺身と三陸の地酒で、にぎやかな夜を過ごせます。",
    recommend: "おすすめ: 刺身盛り合わせ、三陸地酒飲み比べ",
    price: "¥1,500〜4,000",
    addr: "気仙沼市内",
    tags: ["お酒", "海の幸", "がっつり"]
  },
  {
    name: "海辺のカフェ 灯台",
    emoji: "☕",
    genre: "カフェ・スイーツ",
    desc: "海を望む絶景カフェ。気仙沼の景色を眺めながらコーヒーやスイーツでのんびり過ごせる癒しの空間。",
    recommend: "おすすめ: 三陸ミルクのソフトクリーム、海鮮ガレット",
    price: "¥500〜1,200",
    addr: "気仙沼市大島",
    tags: ["くつろぎ", "手軽", "リーズナブル"]
  },
  {
    name: "海鮮丼 潮風",
    emoji: "🍚",
    genre: "海鮮丼専門",
    desc: "その日の水揚げから選ぶ新鮮な海鮮丼の専門店。ボリューム満点で、観光の合間にもぴったりな一軒。",
    recommend: "おすすめ: 三陸海鮮丼、サーモン＆いくら丼",
    price: "¥1,200〜2,500",
    addr: "気仙沼市魚市場周辺",
    tags: ["海の幸", "がっつり", "手軽", "名物"]
  }
];

const selected = new Set();

document.getElementById('moodGrid').addEventListener('click', e => {
  const btn = e.target.closest('.mood-btn');
  if (!btn) return;
  const mood = btn.dataset.mood;
  if (selected.has(mood)) {
    selected.delete(mood);
    btn.classList.remove('selected');
  } else {
    selected.add(mood);
    btn.classList.add('selected');
  }
  document.getElementById('searchBtn').disabled = selected.size === 0;
});

function doSearch() {
  const moods = [...selected];

  const ranked = SHOPS
    .map(s => ({ ...s, score: s.tags.filter(t => moods.includes(t)).length }))
    .sort((a, b) => b.score - a.score);

  const top3 = ranked.slice(0, 3);

  const RANK = [
    { label: '1位', icon: '🥇', cls: 'rank-1' },
    { label: '2位', icon: '🥈', cls: 'rank-2' },
    { label: '3位', icon: '🥉', cls: 'rank-3' },
  ];

  document.getElementById('resultsTitle').textContent =
    `「${moods.join('・')}」の気分にオススメ TOP 3 🎉`;

  document.getElementById('shopList').innerHTML = top3.map((shop, i) => {
    const hitTags  = shop.tags.filter(t =>  moods.includes(t));
    const missTags = shop.tags.filter(t => !moods.includes(t));
    const tagsHtml = [
      ...hitTags.map(t  => `<span class="tag hit">${t}</span>`),
      ...missTags.map(t => `<span class="tag">${t}</span>`),
    ].join('');

    return `
      <div class="shop-card">
        <div class="rank-badge ${RANK[i].cls}">
          <span>${RANK[i].icon}</span>
          <span class="rank-num">${RANK[i].label}</span>
        </div>
        <div class="shop-info">
          <div class="shop-header">
            <span class="shop-name">${shop.emoji} ${shop.name}</span>
            <span class="shop-genre">${shop.genre}</span>
          </div>
          <div class="shop-desc">${shop.desc}</div>
          <div class="shop-recommend">${shop.recommend}</div>
          <div class="shop-meta">
            <span>💰 ${shop.price}</span>
            <span>📍 ${shop.addr}</span>
          </div>
          <div class="match-tags">${tagsHtml}</div>
        </div>
      </div>`;
  }).join('');

  const resultDiv = document.getElementById('results');
  resultDiv.classList.add('show');
  resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
